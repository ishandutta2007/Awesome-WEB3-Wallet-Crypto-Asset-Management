<svg fill="none" viewBox="0 0 1200 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="mesh-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.8; }
        50% { transform: translateY(-8px) scale(1.02); opacity: 1; }
      }
      @keyframes driftGlow {
        0% { transform: translate(0px, 0px); }
        50% { transform: translate(25px, -15px); }
        100% { transform: translate(0px, 0px); }
      }
      @keyframes orbitNode {
        0% { transform: rotate(0deg) translateX(40px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(40px) rotate(-360deg); }
      }
      @keyframes streamPath {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .animated-bg {
        animation: driftGlow 12s ease-in-out infinite;
      }
      .pulse-chip {
        animation: floatPulse 6s ease-in-out infinite;
      }
      .pulse-chip-delayed {
        animation: floatPulse 7s ease-in-out 1.5s infinite;
      }
      .stream-line {
        stroke-dasharray: 20, 10;
        animation: streamPath 18s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <g class="animated-bg">
    <circle cx="200" cy="100" r="140" fill="url(#mesh-glow)" />
    <circle cx="1020" cy="240" r="160" fill="url(#mesh-glow)" />
    <circle cx="650" cy="80" r="180" fill="url(#mesh-glow)" />
  </g>

  <!-- Cyber Grid Pattern Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Constellation / Network Data Streams (kept strictly in background) -->
  <g stroke="url(#cyan-purple)" stroke-width="1.5" stroke-opacity="0.3" fill="none" class="stream-line">
    <path d="M 50 80 Q 250 20 450 90 T 850 70 T 1150 120" />
    <path d="M 80 290 Q 300 340 550 280 T 950 310 T 1160 260" />
  </g>

  <!-- Decorative Blockchain Node Chips (Floating in subtle background positions) -->
  <g class="pulse-chip" opacity="0.85">
    <rect x="960" y="55" width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="982" cy="76" r="6" fill="#38bdf8" filter="url(#glow-light)" />
    <text x="998" y="81" class="pill-text">EVM &amp; Solana</text>
  </g>

  <g class="pulse-chip-delayed" opacity="0.85">
    <rect x="920" y="115" width="220" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="942" cy="136" r="6" fill="#818cf8" filter="url(#glow-light)" />
    <text x="958" y="141" class="pill-text">ERC-4337 Smart Accounts</text>
  </g>

  <g class="pulse-chip" opacity="0.85">
    <rect x="940" y="175" width="200" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="962" cy="196" r="6" fill="#34d399" filter="url(#glow-light)" />
    <text x="978" y="201" class="pill-text">Multi-Sig &amp; MPC Custody</text>
  </g>

  <!-- Outer Glass Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" stroke="url(#cyan-purple)" stroke-opacity="0.25" stroke-width="2" />

  <!-- Primary Foreground Content (Title, Badges, Subtitle) -->
  <g transform="translate(60, 50)">
    <!-- Category Badge -->
    <rect x="0" y="15" width="210" height="28" rx="14" fill="#312e81" fill-opacity="0.6" stroke="#6366f1" stroke-width="1" />
    <circle cx="14" cy="29" r="4" fill="#38bdf8" />
    <text x="26" y="34" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#a5b4fc" letter-spacing="1">CURATED WEB3 ECOSYSTEM</text>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="90" class="title-text">Awesome Web3 Wallet</text>
    <text x="0" y="140" class="title-text" fill="url(#cyan-purple)">&amp; Crypto Asset Management</text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="185" class="subtitle-text">Self-Custody Wallets • Multi-Chain Asset Management • MPC Custody</text>
    <text x="0" y="210" class="subtitle-text">Smart Accounts (ERC-4337) • Hardware Companion Suites • DeFi Trackers</text>

    <!-- Visual Feature Badges in Foreground -->
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">🔐 Self-Custody</text>

      <rect x="135" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="147" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">🛡️ MPC &amp; Multisig</text>

      <rect x="275" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="287" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8">🌐 Multi-Chain</text>

      <rect x="410" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="422" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fde68a">⚡ Open Source</text>
    </g>
  </g>
</svg>
